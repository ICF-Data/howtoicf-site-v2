[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/downloads/icf-readiness-checklist"
  to = "/checklist.pdf"
  status = 301

[[redirects]]
  from = "/guides/*"
  to = "/#work-with-eric"
  status = 301
  force = true

[[redirects]]
  from = "/guides"
  to = "/#work-with-eric"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
